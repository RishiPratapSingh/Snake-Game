<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Snake Game</h1>
    <div id="gameContainer" style="display:flex; flex-direction:column; align-items:center; width:100%; height:100%;">
        <canvas id="gameCanvas"></canvas>
        <p id="score">Score: 0</p>
        <div id="controls" style="margin-top:10px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; justify-content:center;">
            <label for="speedControl">Speed:</label>
            <input type="range" id="speedControl" min="50" max="300" step="10" value="100">
            <span id="speedValue">100 ms</span>
            <label for="snakeColor">Snake:</label>
            <input type="color" id="snakeColor" value="#00ff00">
            <label for="foodColor">Food:</label>
            <input type="color" id="foodColor" value="#ff0000">
            <label for="bgColor">Background:</label>
            <input type="color" id="bgColor" value="#222222">
            <button id="startBtn">Start / Restart</button>
        </div>
    </div>
    <div id="gameOverOverlay" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:1.5rem;">
        <div id="gameOverMessage"></div>
        <button id="restartBtn" style="margin-top:15px; padding:8px 16px;">Play Again</button>
    </div>
    <!-- audio effects -->
    <!-- Simple beep sounds using data URIs -->
    <audio id="eatSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQA=" type="audio/wav">
    </audio>
    <audio id="gameOverSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQA=" type="audio/wav">
    </audio>
    <script src="script.js"></script>
</body>
</html>
